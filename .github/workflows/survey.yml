name: survey
on:
  push:
    branches: [survey]
jobs:
  survey:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04-arm, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          for u in http://azure.archive.ubuntu.com/ubuntu http://archive.ubuntu.com/ubuntu http://ports.ubuntu.com/ubuntu-ports https://mirrors.edge.kernel.org/ubuntu-ports; do
            echo "$u: $(curl -s -o /dev/null -w '%{http_code}' $u/dists/noble/main/binary-arm64/Release)"
          done
          time sudo apt-get update 2>&1 | tail -20
          apt-cache policy | head -20
          ls /var/lib/apt/lists
