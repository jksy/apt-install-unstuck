name: survey
on:
  push:
    branches: [survey]
  workflow_dispatch:
jobs:
  survey:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-22.04-arm, ubuntu-24.04-arm, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          set -x
          cat /etc/os-release
          uname -m; dpkg --print-architecture
          id; sudo -n true && echo sudo-ok
          ls -la /etc/apt /etc/apt/sources.list.d /etc/apt/apt.conf.d
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt; do
            echo "===== $f"; cat "$f" || true
          done
          for f in /etc/apt/apt.conf.d/*; do echo "===== $f"; cat "$f"; done
          apt-config dump | grep -Ei 'Dir|Lock|Acquire|Retries' || true
          ls -la /var/cache/apt/archives /var/lib/apt/lists | head -50
          stat -c '%U:%G %a %n' /var/cache/apt/archives/partial /var/lib/apt/lists/partial
          apt-get --version | head -1
          which timeout python3; python3 --version
