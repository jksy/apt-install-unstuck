name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-zigbuild
      - name: Build static binaries
        working-directory: proxy
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
      - name: Collect assets
        run: |
          mkdir assets
          for arch in x86_64 aarch64; do
            cp "proxy/target/$arch-unknown-linux-musl/release/unstuck-proxy" "assets/unstuck-proxy-$arch-linux"
          done
          (cd assets && sha256sum unstuck-proxy-* > SHA256SUMS && cat SHA256SUMS)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" assets/* --verify-tag --generate-notes --title "$TAG"
      # The action downloads the binary from the release named after its ref,
      # so `uses: owner/repo@v1` needs a `v1` release that follows the latest v1.x.y.
      - name: Update major version tag and release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          gh release delete "$major" --yes 2>/dev/null || true
          git tag -f "$major" "$TAG^{commit}"
          git push -f origin "refs/tags/$major"
          gh release create "$major" assets/* --verify-tag --latest=false \
            --title "$major" --notes "Same binaries as $TAG. This release follows the latest $major.x.y."
