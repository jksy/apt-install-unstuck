name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proxy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Static musl binaries, built the same way as in release.yml.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proxy
          key: musl
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - working-directory: proxy
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@v7
        with:
          name: unstuck-proxy-x86_64
          path: proxy/target/x86_64-unknown-linux-musl/release/unstuck-proxy
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: unstuck-proxy-aarch64
          path: proxy/target/aarch64-unknown-linux-musl/release/unstuck-proxy
          if-no-files-found: error

  e2e:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-22.04-arm, ubuntu-24.04-arm, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    services:
      # TODO: stopgap. minio/minio images are no longer published (the repo is
      # archived and AIStor Free needs a license key). Replace with another
      # S3-compatible server.
      minio:
        image: bitnamilegacy/minio:latest
        ports: ['9000:9000']
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: apt-cache
    env:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      DEAD_MIRRORS: ubuntu=http://127.0.0.1:9/ubuntu/;ubuntu-ports=http://127.0.0.1:9/ubuntu-ports/
      SLOW_MIRRORS: ubuntu=http://127.0.0.1:8081/ubuntu/,origin;ubuntu-ports=http://127.0.0.1:8081/ubuntu-ports/,origin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: unstuck-proxy-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/bin
      - name: Use the prebuilt proxy
        run: |
          chmod +x "$RUNNER_TEMP/bin/unstuck-proxy"
          echo "UNSTUCK_PROXY_BIN=$RUNNER_TEMP/bin/unstuck-proxy" >> "$GITHUB_ENV"
      - name: Show apt sources
        run: |
          grep -rhE '^(deb|URIs|Types|Suites)' /etc/apt/sources.list /etc/apt/sources.list.d/ || true
          cat /etc/apt/apt-mirrors.txt 2>/dev/null || true
      - name: Wait for MinIO bucket
        run: |
          for i in $(seq 60); do
            docker exec "${{ job.services.minio.id }}" mc ls local/apt-cache > /dev/null 2>&1 && exit 0
            sleep 1
          done
          exit 1
      - name: Start slow mirror
        run: |
          nohup python3 .github/e2e/slow-mirror.py 8081 2048 > "$RUNNER_TEMP/slow-mirror.log" 2>&1 &
          for i in $(seq 20); do curl -s -o /dev/null http://127.0.0.1:8081/ && exit 0; sleep 0.5; done
          exit 1

      # A slow mirror sits in front of the origin, so the proxy has to switch
      # away from it; downloads also fill the S3 (MinIO) cache.
      - id: unstuck
        uses: ./
        with:
          cache: s3://apt-cache/e2e
          cache-key-prefix: e2e
          mirrors: ${{ env.SLOW_MIRRORS }}
          stall-timeout: 3
          fail-on-error: true
      - id: again
        uses: ./
        with:
          fail-on-error: true
      - name: Check the second call reused the proxy
        run: test "${{ steps.again.outputs.proxy-url }}" = "${{ steps.unstuck.outputs.proxy-url }}"

      - name: Install with unchanged apt commands
        run: |
          sudo apt-get update 2>&1 | tee "$RUNNER_TEMP/update.log"
          if grep -q 'Invalid response from proxy' "$RUNNER_TEMP/update.log"; then
            echo "::error::a request that should have gone DIRECT reached the proxy"
            exit 1
          fi
          sudo apt-get install -y ghostscript
          gs --version
      - name: Check the proxy handled the downloads
        env:
          PROXY: ${{ steps.unstuck.outputs.proxy-url }}
        run: |
          # Wait for cache uploads to finish before the offline check.
          for i in $(seq 60); do
            curl -sf "$PROXY/_stats" > stats.json
            jq -e '.in_flight == 0' stats.json > /dev/null && break
            sleep 1
          done
          cat stats.json
          jq -e '.misses > 0 and .failovers > 0 and .cache_writes > 0 and .errors == 0' stats.json

      # Every mirror unreachable: the reinstall must come from the cache alone,
      # with InRelease served stale. A second proxy is started directly, since
      # the action reuses the running one.
      - name: Reinstall from the cache only
        run: |
          "$UNSTUCK_PROXY_BIN" --port-file offline.addr --cache s3://apt-cache/e2e --cache-prefix e2e \
            --mirrors "$DEAD_MIRRORS" --rounds 1 > "$RUNNER_TEMP/offline.log" 2>&1 &
          for i in $(seq 50); do test -s offline.addr && break; sleep 0.1; done
          proxy="http://$(cat offline.addr)"
          opts=(-o Acquire::http::Proxy-Auto-Detect= -o "Acquire::http::Proxy=$proxy" -o Acquire::https::Proxy=DIRECT -o Acquire::Retries=0)
          sudo apt-get clean
          sudo apt-get "${opts[@]}" update
          sudo apt-get "${opts[@]}" install --reinstall -y ghostscript
          curl -sf "$proxy/_stats" | tee stats.json
          jq -e '.hits > 0 and .stale > 0' stats.json
      - if: always()
        run: |
          cat "$RUNNER_TEMP/slow-mirror.log" "$RUNNER_TEMP/offline.log" || true

  # Default inputs, and no release for the ref: the action builds the proxy with cargo.
  e2e-defaults:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proxy
          key: action-build
      - id: unstuck
        uses: ./
        with:
          fail-on-error: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y sl
          curl -sf "${{ steps.unstuck.outputs.proxy-url }}/_stats" | tee stats.json
          jq -e '.misses > 0' stats.json

  # In a container job the action, the proxy and apt all run inside the
  # container, as root and without ca-certificates.
  e2e-container:
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: unstuck-proxy-x86_64
          path: /opt/unstuck-bin
      - run: |
          chmod +x /opt/unstuck-bin/unstuck-proxy
          echo "UNSTUCK_PROXY_BIN=/opt/unstuck-bin/unstuck-proxy" >> "$GITHUB_ENV"
      - id: unstuck
        uses: ./
        with:
          fail-on-error: true
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends curl jq sl
          curl -sf "${{ steps.unstuck.outputs.proxy-url }}/_stats" | tee stats.json
          jq -e '.misses > 0' stats.json
