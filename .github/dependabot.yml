version: 2
updates:
  - package-ecosystem: cargo
    directory: /proxy
    schedule:
      interval: weekly

  # Tools that CI builds from source (see .github/tools/). go.mod marks
  # tool dependencies `// indirect`, which Dependabot skips by default, so
  # each tool is allowed explicitly. Only the tool itself is bumped; its
  # own dependencies follow from its go.mod.
  - package-ecosystem: gomod
    directories:
      - /.github/tools/actionlint
      - /.github/tools/gitleaks
    schedule:
      interval: weekly
    allow:
      - dependency-name: github.com/rhysd/actionlint
        dependency-type: all
      - dependency-name: github.com/zricethezav/gitleaks/v8
        dependency-type: all

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
